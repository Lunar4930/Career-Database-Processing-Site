[project]
name = "career-database-processing-site"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.3,<5",
    "pandas>=2.2.3,<3",
    "pydantic>=2.12.5,<3",
    "pymupdf>=1.25.3,<2",
    "python-dotenv>=1.2.2,<2",
    "streamlit>=1.54.0,<2",
    "tavily-python>=0.8.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-socket>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Streamlit's test runner uses local Unix sockets for its asyncio event loop.
# TCP/IP sockets and DNS remain blocked, including calls from API clients.
addopts = "--strict-markers --disable-socket --allow-unix-socket"
required_plugins = ["pytest-socket"]
